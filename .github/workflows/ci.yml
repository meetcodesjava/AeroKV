name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build
        run: mvn -B clean compile

      - name: Start AeroKV server
        run: |
          nohup mvn -q exec:java -Dexec.mainClass="day06.AeroKVServerApp" > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server to accept connections
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null; then
              echo "Server is up."
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start in time."
          cat server.log
          exit 1

      - name: Run production readiness suite
        run: |
          cd src
          python production_suite.py --soak-seconds 8

      - name: Dump server log on failure
        if: failure()
        run: cat server.log

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
